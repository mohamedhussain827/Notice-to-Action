<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice-to-Action | Smart Student Notice Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F172A;
  --ink-2:#1E293B;
  --paper:#F8FAFC;
  --paper-2:#EEF2F6;
  --card:rgba(255, 255, 255, 0.92);
  --card-solid:#FFFFFF;
  --line:rgba(226, 232, 240, 0.9);
  --line-strong:#CBD5E1;
  
  /* Brand Vibrance */
  --brand:#4F46E5;
  --brand-2:#7C3AED;
  --brand-3:#EC4899;
  --brand-ink:#3730A3;
  --brand-bg:rgba(99, 102, 241, 0.1);
  --brand-bg-strong:rgba(99, 102, 241, 0.18);
  
  /* Accents */
  --highlighter:#F59E0B;
  --highlighter-ink:#B45309;
  --highlighter-bg:rgba(245, 158, 11, 0.12);
  
  --green:#10B981;
  --green-ink:#047857;
  --green-bg:rgba(16, 185, 129, 0.12);
  
  --coral:#F43F5E;
  --coral-ink:#BE123C;
  --coral-bg:rgba(244, 63, 94, 0.12);
  
  --blue:#0EA5E9;
  --blue-ink:#0369A1;
  --blue-bg:rgba(14, 165, 233, 0.12);

  --purple:#8B5CF6;
  --purple-ink:#6D28D9;
  --purple-bg:rgba(139, 92, 246, 0.12);

  --ink-soft:#64748B;
  --ink-faint:#94A3B8;

  --radius-s:10px;
  --radius-m:14px;
  --radius-l:20px;
  --radius-xl:26px;

  /* Shadows with colorful ambiance */
  --shadow-xs:0 2px 5px rgba(15, 23, 42, 0.04);
  --shadow:0 12px 28px -8px rgba(15, 23, 42, 0.08), 0 4px 12px -4px rgba(15, 23, 42, 0.04);
  --shadow-lg:0 24px 48px -12px rgba(99, 102, 241, 0.18), 0 10px 24px -6px rgba(15, 23, 42, 0.08);
  --shadow-glow-brand:0 12px 30px -6px rgba(99, 102, 241, 0.5);
  --shadow-glow-coral:0 12px 30px -6px rgba(244, 63, 94, 0.4);
  --shadow-glow-amber:0 12px 30px -6px rgba(245, 158, 11, 0.4);
  --shadow-glow-green:0 12px 30px -6px rgba(16, 185, 129, 0.4);

  /* Vivid Gradients */
  --grad-brand:linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #EC4899 100%);
  --grad-brand-alt:linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
  --grad-coral:linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
  --grad-amber:linear-gradient(135deg, #F59E0B 0%, #F97316 100%);
  --grad-green:linear-gradient(135deg, #10B981 0%, #06B6D4 100%);
  --grad-purple:linear-gradient(135deg, #8B5CF6 0%, #D946EF 100%);
  --grad-sky:linear-gradient(135deg, #0EA5E9 0%, #3B82F6 100%);
  
  --grad-sidebar:linear-gradient(180deg, #0F172A 0%, #0B0F19 100%);
  
  --sans:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --display:'Outfit', 'Plus Jakarta Sans', sans-serif;
  --mono:'JetBrains Mono', monospace;
}

[data-theme="dark"]{
  --ink:#F8FAFC;
  --ink-2:#E2E8F0;
  --paper:#090D16;
  --paper-2:#111726;
  --card:rgba(17, 24, 39, 0.85);
  --card-solid:#111827;
  --line:rgba(255, 255, 255, 0.08);
  --line-strong:rgba(255, 255, 255, 0.16);
  --ink-soft:#94A3B8;
  --ink-faint:#64748B;
  --brand-bg:rgba(99, 102, 241, 0.2);
  --green-bg:rgba(16, 185, 129, 0.2);
  --coral-bg:rgba(244, 63, 94, 0.2);
  --amber-bg:rgba(245, 158, 11, 0.2);
  --blue-bg:rgba(14, 165, 233, 0.2);
  --purple-bg:rgba(139, 92, 246, 0.2);
  --shadow:0 14px 32px -8px rgba(0, 0, 0, 0.6);
  --shadow-lg:0 28px 60px -12px rgba(0, 0, 0, 0.8);
  --grad-sidebar:linear-gradient(180deg, #070A12 0%, #030408 100%);
}

*{box-sizing:border-box; margin:0; padding:0;}
html, body{height:100%;}
body{
  font-family:var(--sans);
  background:var(--paper);
  background-image: 
    radial-gradient(circle at 8% 12%, rgba(99, 102, 241, 0.09) 0%, transparent 35%),
    radial-gradient(circle at 92% 8%, rgba(236, 72, 153, 0.08) 0%, transparent 35%),
    radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.07) 0%, transparent 45%);
  background-attachment: fixed;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
[data-theme="dark"] body{
  background-image: 
    radial-gradient(circle at 8% 12%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
    radial-gradient(circle at 92% 8%, rgba(236, 72, 153, 0.14) 0%, transparent 40%),
    radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.12) 0%, transparent 50%);
}

a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit; color:inherit;}
::selection{background:rgba(99, 102, 241, 0.3); color:var(--ink);}

h1,h2,h3,h4,h5{
  font-family:var(--display);
  font-weight:700;
  letter-spacing:-0.025em;
  line-height:1.2;
}
.display{font-family:var(--display);}
.mono{font-family:var(--mono);}

.gradient-text{
  background:var(--grad-brand);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  display:inline-block;
}
.gradient-text-alt{
  background:linear-gradient(135deg, #FF6B6B 0%, #FF8E53 50%, #F59E0B 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  display:inline-block;
}

/* ---------- Layout shell ---------- */
#app{min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex-shrink:0; background:var(--grad-sidebar); color:#94A3B8;
  display:flex; flex-direction:column; padding:24px 18px; position:sticky; top:0; height:100vh;
  box-shadow:10px 0 35px -10px rgba(0,0,0,.5);
  border-right:1px solid rgba(255,255,255,.07);
  z-index:20;
}
.sidebar .brand{display:flex; align-items:center; gap:12px; padding:6px 10px 24px 10px;}
.sidebar .brand .mark{
  width:38px; height:38px; border-radius:12px; background:var(--grad-brand);
  display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--display); font-weight:800; font-size:18px;
  box-shadow:0 8px 20px -4px rgba(99,102,241,.6), inset 0 1px 1px rgba(255,255,255,.4);
}
.sidebar .brand .name{font-family:var(--display); font-weight:700; font-size:17.5px; color:#fff; letter-spacing:-0.01em;}
.sidebar .brand .name span{color:#A5B4FC;}
.navgroup{display:flex; flex-direction:column; gap:5px; margin-top:4px;}
.navitem{
  display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:12px;
  font-size:14px; font-weight:600; color:#94A3B8; transition:all .2s ease;
}
.navitem svg{width:18px; height:18px; flex-shrink:0; opacity:.85; transition:transform .2s;}
.navitem:hover{background:rgba(255,255,255,.07); color:#fff; transform:translateX(3px);}
.navitem:hover svg{transform:scale(1.1); color:#A5B4FC;}
.navitem.active{
  background:var(--grad-brand); color:#fff; font-weight:700;
  box-shadow:0 8px 22px -6px rgba(99,102,241,.6), inset 0 1px 1px rgba(255,255,255,.3);
  transform:translateX(2px);
}
.navitem.active svg{opacity:1; color:#fff;}
.navitem .badge{
  margin-left:auto; background:#EC4899; color:#fff; font-size:11px; font-weight:800;
  padding:2px 8px; border-radius:20px; font-family:var(--sans);
  box-shadow:0 3px 8px -2px rgba(236,72,153,.6);
}
.sidebar-foot{margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,.08);}
.role-pill{
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  background:rgba(99,102,241,.2); color:#C7D2FE; border:1px solid rgba(99,102,241,.3);
  padding:3px 10px; border-radius:20px; display:inline-block; margin-bottom:12px;
}
.user-chip{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px;
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06);
  transition:all .2s;
}
.user-chip:hover{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.12);}
.avatar{
  width:34px; height:34px; border-radius:10px; background:var(--grad-brand); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
  box-shadow:0 4px 12px -2px rgba(99,102,241,.5), inset 0 1px 1px rgba(255,255,255,.4);
}
.user-chip .u-name{font-size:13.5px; font-weight:700; color:#fff;}
.user-chip .u-email{font-size:11.5px; color:#94A3B8;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:16px 36px;
  border-bottom:1px solid var(--line); position:sticky; top:0;
  background:rgba(255,255,255,0.78); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  z-index:15; transition:background .2s;
}
[data-theme="dark"] .topbar{
  background:rgba(9, 13, 22, 0.82);
}
.topbar-search{
  display:flex; align-items:center; gap:10px; background:var(--card-solid); border:1px solid var(--line);
  border-radius:12px; padding:9px 14px; width:340px; color:var(--ink-soft); font-size:13.5px;
  box-shadow:var(--shadow-xs); transition:all .2s; cursor:pointer;
}
.topbar-search:hover{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg);}
.topbar-search svg{width:16px; height:16px; color:var(--brand);}
.topbar-search input{background:none; border:none; outline:none; width:100%; font-size:13.5px; color:var(--ink); font-weight:500;}
.topbar-actions{display:flex; align-items:center; gap:12px;}
.icon-btn{
  width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:var(--card-solid); border:1px solid var(--line); position:relative;
  box-shadow:var(--shadow-xs); transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);
}
.icon-btn svg{width:18px; height:18px; color:var(--ink-soft); transition:color .15s;}
.icon-btn:hover{
  border-color:var(--brand); color:var(--brand);
  transform:translateY(-2px); box-shadow:0 6px 16px -4px rgba(99,102,241,.25);
}
.icon-btn:hover svg{color:var(--brand);}
.dot{position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%; background:#F43F5E; border:2px solid #fff; box-shadow:0 0 8px #F43F5E;}
.content{padding:32px 36px 70px 36px; max-width:1240px; width:100%; margin:0 auto;}

/* ---------- Cards & Surfaces ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-l);
  padding:24px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.card:hover{border-color:rgba(99, 102, 241, 0.2);}
.card-flat{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px;
  box-shadow:var(--shadow-xs);
}

/* ---------- Stat Cards (Lively & Colorful) ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:30px;}
.stat-card-rich{
  position:relative; overflow:hidden; padding:22px; border-radius:var(--radius-l);
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
  display:flex; flex-direction:column; justify-content:space-between; min-height:140px;
  transition:all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.stat-card-rich:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow-lg);
}
.stat-card-rich::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--card-accent, var(--grad-brand));
}
.stat-card-rich .top-row{display:flex; align-items:center; justify-content:space-between;}
.stat-card-rich .stat-icon{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  color:#fff; background:var(--card-accent, var(--grad-brand));
  box-shadow:0 6px 16px -4px var(--card-glow, rgba(99,102,241,.5));
}
.stat-card-rich .stat-icon svg{width:22px; height:22px;}
.stat-card-rich .stat-pill{
  font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
  letter-spacing:.02em;
}
.stat-card-rich .n{
  font-family:var(--display); font-size:36px; font-weight:800; line-height:1;
  margin-top:14px; color:var(--ink);
}
.stat-card-rich .l{font-size:13px; font-weight:600; color:var(--ink-soft); margin-top:5px;}

/* Specific Stat Card Variants */
.stat-pending{
  --card-accent:linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
  --card-glow:rgba(79, 70, 229, 0.5);
}
.stat-pending .stat-pill{background:var(--brand-bg); color:var(--brand-ink);}

.stat-duesoon{
  --card-accent:linear-gradient(135deg, #F43F5E 0%, #E11D48 100%);
  --card-glow:rgba(244, 63, 94, 0.5);
}
.stat-duesoon .stat-pill{background:var(--coral-bg); color:var(--coral-ink);}

.stat-completed{
  --card-accent:linear-gradient(135deg, #10B981 0%, #059669 100%);
  --card-glow:rgba(16, 185, 129, 0.5);
}
.stat-completed .stat-pill{background:var(--green-bg); color:var(--green-ink);}

.stat-important{
  --card-accent:linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
  --card-glow:rgba(245, 158, 11, 0.5);
}
.stat-important .stat-pill{background:var(--amber-bg); color:var(--highlighter-ink);}

/* ---------- Buttons (Vibrant & Polished) ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 20px; border-radius:12px; font-size:14px; font-weight:700;
  transition:all .2s cubic-bezier(0.34, 1.56, 0.64, 1); white-space:nowrap; cursor:pointer;
}
.btn svg{width:16px; height:16px; flex-shrink:0;}
.btn-primary{
  background:var(--grad-brand); color:#fff;
  box-shadow:0 8px 20px -4px rgba(99,102,241,.5), inset 0 1px 1px rgba(255,255,255,.35);
  border:1px solid rgba(255,255,255,.15);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px -6px rgba(99,102,241,.65), inset 0 1px 1px rgba(255,255,255,.45);
}
.btn-primary:active{transform:translateY(1px); box-shadow:0 4px 12px -2px rgba(99,102,241,.4);}

.btn-highlight{
  background:linear-gradient(135deg, #F59E0B 0%, #EA580C 100%); color:#fff;
  box-shadow:0 8px 20px -4px rgba(245,158,11,.45), inset 0 1px 1px rgba(255,255,255,.35);
}
.btn-highlight:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 26px -6px rgba(245,158,11,.6);
  filter:brightness(1.05);
}

.btn-ghost{
  background:var(--card-solid); border:1px solid var(--line); color:var(--ink);
  box-shadow:var(--shadow-xs);
}
.btn-ghost:hover{
  border-color:var(--brand); color:var(--brand);
  box-shadow:0 6px 16px -4px rgba(99,102,241,.2);
  transform:translateY(-1px);
}
.btn-text{color:var(--ink-soft); font-weight:700; font-size:13.5px; padding:6px 10px; border-radius:8px; transition:all .15s;}
.btn-text:hover{color:var(--brand); background:var(--brand-bg);}
.btn-sm{padding:7px 14px; font-size:12.8px; border-radius:9px;}
.btn-danger{background:var(--coral-bg); color:var(--coral); font-weight:700;}
.btn-danger:hover{background:var(--coral); color:#fff; box-shadow:0 6px 16px -4px rgba(244,63,94,.5);}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none !important; box-shadow:none !important;}
.btn-block{width:100%;}

/* ---------- Pills / Tags ---------- */
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:20px; font-size:12px; font-weight:700;}
.pill-high{
  background:linear-gradient(135deg, rgba(244,63,94,.15), rgba(244,63,94,.08));
  color:#E11D48; border:1px solid rgba(244,63,94,.3);
}
.pill-medium{
  background:linear-gradient(135deg, rgba(245,158,11,.15), rgba(245,158,11,.08));
  color:#D97706; border:1px solid rgba(245,158,11,.3);
}
.pill-low{
  background:linear-gradient(135deg, rgba(16,185,129,.15), rgba(16,185,129,.08));
  color:#059669; border:1px solid rgba(16,185,129,.3);
}
.pill-neutral{
  background:var(--paper-2); color:var(--ink-soft); border:1px solid var(--line);
}

/* ---------- Notice List Items ---------- */
.notice-card{
  display:flex; gap:16px; padding:18px; border-radius:var(--radius-m);
  border:1px solid transparent; background:transparent; transition:all .2s ease;
  align-items:center;
}
.notice-card:hover{
  background:var(--card-solid);
  border-color:var(--line);
  box-shadow:var(--shadow);
  transform:translateY(-2px);
}
.cat-icon{
  width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all .2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.notice-card:hover .cat-icon{transform:scale(1.08) rotate(3deg);}
.cat-icon svg{width:22px; height:22px;}
.notice-card .body{flex:1; min-width:0;}
.notice-card .row1{display:flex; align-items:center; gap:10px; justify-content:space-between;}
.notice-card .ttl{font-weight:700; font-size:15px; color:var(--ink); line-height:1.3;}
.notice-card .meta{font-size:12.5px; color:var(--ink-soft); margin-top:4px; display:flex; gap:14px; align-items:center;}
.notice-card .meta span{display:inline-flex; align-items:center; gap:4px;}

/* ---------- Deadline & Progress ---------- */
.deadline-box{
  display:flex; align-items:center; gap:16px;
  background:linear-gradient(120deg, rgba(245,158,11,0.12) 0%, rgba(244,63,94,0.12) 100%);
  border:1px solid rgba(244,63,94,0.25);
  border-radius:var(--radius-m); padding:18px 20px; margin:18px 0;
  box-shadow:0 8px 20px -6px rgba(244,63,94,0.15);
}
.deadline-box .dclock{
  width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg, #F43F5E, #FB7185);
  color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 8px 18px -4px rgba(244,63,94,.5);
}
.deadline-box .dclock svg{width:22px; height:22px;}
.deadline-box .dlabel{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--coral-ink); font-weight:800;}
.deadline-box .dvalue{font-family:var(--display); font-weight:800; font-size:22px; color:var(--ink); margin-top:2px;}

.progress{height:9px; border-radius:20px; background:var(--paper-2); overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.08); margin-top:8px;}
.progress > div{
  height:100%; border-radius:20px;
  background:linear-gradient(90deg, #4F46E5 0%, #7C3AED 50%, #EC4899 100%);
  box-shadow:0 0 12px rgba(124,58,237,.5);
  transition:width .4s ease;
}

/* ---------- Checkboxes & Tasks ---------- */
.checkline{display:flex; align-items:flex-start; gap:12px; padding:12px 10px; border-radius:10px; transition:background .15s;}
.checkline:hover{background:var(--paper-2);}
.checkbox{
  width:22px; height:22px; border-radius:7px; border:2px solid var(--ink-faint); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; transition:all .2s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor:pointer;
}
.checkbox:hover{border-color:var(--brand); transform:scale(1.1);}
.checkbox.done{
  background:linear-gradient(135deg, #10B981, #059669); border-color:#059669;
  box-shadow:0 4px 10px -2px rgba(16,185,129,.5);
}
.checkbox svg{width:13px; height:13px; color:#fff; opacity:0; transition:opacity .15s;}
.checkbox.done svg{opacity:1;}
.checkline.done .clabel{text-decoration:line-through; color:var(--ink-faint);}

/* ---------- Quick Action Buttons ---------- */
.quick-actions{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
.qa-btn{
  display:flex; flex-direction:column; gap:10px; align-items:flex-start; padding:18px; border:1px solid var(--line);
  border-radius:var(--radius-m); background:var(--card); box-shadow:var(--shadow-xs);
  transition:all .2s cubic-bezier(0.34, 1.56, 0.64, 1); cursor:pointer;
}
.qa-btn:hover{
  border-color:rgba(99,102,241,.4); box-shadow:var(--shadow); transform:translateY(-3px);
}
.qa-btn .qa-icon-wrap{
  width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  color:#fff; box-shadow:0 6px 14px -4px rgba(0,0,0,.25);
}
.qa-btn .qa-icon-wrap svg{width:20px; height:20px;}
.qa-btn span{font-size:13.5px; font-weight:700; color:var(--ink);}

/* ---------- Form Controls ---------- */
input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{
  width:100%; padding:12px 16px; border:1.5px solid var(--line); border-radius:12px; background:var(--card-solid);
  font-size:14px; outline:none; transition:all .18s; color:var(--ink);
}
input:focus,textarea:focus,select:focus{
  border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-bg);
}
label.field-label{font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; display:block;}
.field{margin-bottom:18px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.divider{height:1px; background:var(--line); margin:22px 0;}
.section-label{
  font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:800; margin-bottom:12px;
  display:flex; align-items:center; justify-content:space-between;
}

/* ---------- Method Tabs & Document Chips ---------- */
.method-tabs{display:flex; gap:10px; margin-bottom:22px;}
.mtab{
  padding:11px 20px; border-radius:12px; border:1px solid var(--line); font-size:13.5px; font-weight:700;
  color:var(--ink-soft); cursor:pointer; transition:all .2s; background:var(--card-solid);
}
.mtab:hover{border-color:var(--brand); color:var(--brand);}
.mtab.active{
  background:var(--grad-brand); color:#fff; border-color:transparent;
  box-shadow:0 6px 18px -4px rgba(99,102,241,.5);
}
.doc-chip{
  display:inline-flex; align-items:center; gap:8px; padding:8px 14px;
  background:linear-gradient(135deg, rgba(99,102,241,.1), rgba(139,92,246,.1));
  border:1px solid rgba(99,102,241,.25); border-radius:10px; font-size:13px; font-weight:600;
  color:var(--brand-ink); margin:4px 8px 4px 0;
}
.doc-chip svg{width:15px; height:15px; color:var(--brand);}
.upload-drop{
  border:2px dashed rgba(99,102,241,.35); border-radius:var(--radius-l); padding:44px 20px;
  text-align:center; color:var(--ink-soft); cursor:pointer; background:rgba(99,102,241,.03);
  transition:all .2s;
}
.upload-drop:hover{border-color:var(--brand); background:rgba(99,102,241,.08); transform:scale(1.01);}
.upload-drop svg{width:36px; height:36px; color:var(--brand); margin-bottom:8px;}

/* ---------- Landing Page (Rich & Wow) ---------- */
.landing-nav{
  display:flex; align-items:center; justify-content:space-between; padding:24px 56px; max-width:1320px; margin:0 auto;
}
.landing-nav .brand-mark{
  width:42px; height:42px; border-radius:14px; background:var(--grad-brand);
  display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--display); font-weight:900; font-size:22px;
  box-shadow:0 8px 20px -4px rgba(99,102,241,.6);
}
.landing-nav .brand-name{font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:-0.02em; color:var(--ink);}

.hero{
  padding:70px 56px 50px 56px; max-width:1320px; margin:0 auto;
  display:grid; grid-template-columns:1.15fr 1fr; gap:64px; align-items:center; position:relative;
}
.hero-tag{
  display:inline-flex; align-items:center; gap:8px; padding:7px 16px; border-radius:30px;
  background:linear-gradient(135deg, rgba(99,102,241,.12), rgba(236,72,153,.12));
  border:1px solid rgba(99,102,241,.25); color:var(--brand-ink); font-size:12.5px; font-weight:800;
  letter-spacing:.03em; text-transform:uppercase; margin-bottom:20px;
  box-shadow:0 4px 12px -2px rgba(99,102,241,.2);
}
.hero-tag svg, .overview-tag svg{width:16px; height:16px; color:var(--brand); flex-shrink:0; display:inline-block;}
.hero h1{
  font-size:56px; letter-spacing:-0.03em; line-height:1.1; margin-bottom:20px;
}
.hero .lede{font-size:17.5px; color:var(--ink-soft); line-height:1.65; max-width:520px;}
.hero-cta{display:flex; gap:16px; margin-top:36px; align-items:center;}

.hero-stats-strip{display:flex; gap:36px; margin-top:44px;}
.hero-stat-item{display:flex; flex-direction:column;}
.hero-stat-item .num{
  font-family:var(--display); font-size:32px; font-weight:900; line-height:1;
  background:var(--grad-brand); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.hero-stat-item .lbl{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-top:6px;}

.hero-visual{position:relative; perspective:1400px;}
.hero-visual-card-1{
  background:var(--card-solid); border:1px solid var(--line); border-radius:20px; padding:28px;
  box-shadow:0 24px 60px -12px rgba(15,23,42,.15); position:relative; z-index:1;
  transform:rotateY(-8deg) rotateX(4deg); transition:all .3s ease;
}
.hero-visual-card-1:hover{transform:rotateY(-4deg) rotateX(2deg) translateY(-6px);}
.hero-visual-card-2{
  background:var(--grad-brand); color:#fff; border-radius:20px; padding:26px;
  box-shadow:0 30px 60px -12px rgba(99,102,241,.6), inset 0 1px 1px rgba(255,255,255,.3);
  position:relative; z-index:2; margin-left:14%; margin-top:-44px;
  transform:rotateY(-8deg) rotateX(4deg) translateZ(40px);
  transition:all .3s ease;
}
.hero-visual-card-2:hover{transform:rotateY(-4deg) rotateX(2deg) translateZ(50px) translateY(-6px);}

.how-section{padding:70px 56px; max-width:1320px; margin:0 auto;}
.how-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px; margin-top:38px;}
.how-card{
  padding:30px; border-radius:var(--radius-l); background:var(--card); border:1px solid var(--line);
  box-shadow:var(--shadow); position:relative; overflow:hidden; transition:all .25s ease;
}
.how-card:hover{transform:translateY(-6px); box-shadow:var(--shadow-lg); border-color:rgba(99,102,241,.3);}
.how-card .step-num{
  width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--display); font-weight:800; font-size:15px; margin-bottom:18px;
}
.how-card:nth-child(1) .step-num{background:linear-gradient(135deg, #4F46E5, #7C3AED); box-shadow:0 6px 14px -4px rgba(79,70,229,.6);}
.how-card:nth-child(2) .step-num{background:linear-gradient(135deg, #EC4899, #F43F5E); box-shadow:0 6px 14px -4px rgba(236,72,153,.6);}
.how-card:nth-child(3) .step-num{background:linear-gradient(135deg, #10B981, #06B6D4); box-shadow:0 6px 14px -4px rgba(16,185,129,.6);}
.how-card h3{font-size:20px; margin-bottom:10px;}
.how-card p{font-size:14px; color:var(--ink-soft); line-height:1.65;}

.cats-strip{display:flex; flex-wrap:wrap; gap:12px; padding:0 56px 80px 56px; max-width:1320px; margin:0 auto;}
.cat-chip{
  padding:9px 18px; border-radius:24px; border:1px solid var(--line); font-size:13px; font-weight:700;
  background:var(--card-solid); box-shadow:var(--shadow-xs); transition:all .2s; cursor:pointer;
  display:inline-flex; align-items:center; gap:8px;
}
.cat-chip:hover{
  transform:translateY(-3px); border-color:var(--brand);
  box-shadow:0 8px 18px -4px rgba(99,102,241,.25);
}

.landing-footer{
  border-top:1px solid var(--line); padding:32px 56px; display:flex; justify-content:space-between; align-items:center;
  max-width:1320px; margin:0 auto; font-size:13.5px; color:var(--ink-soft);
}

/* ---------- Calendar Grid ---------- */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:16px;}
.cal-dow{font-size:12px; text-align:center; color:var(--ink-faint); font-weight:800; padding-bottom:8px; text-transform:uppercase; letter-spacing:.04em;}
.cal-cell{
  min-height:72px; border:1px solid var(--line); border-radius:12px; padding:8px; font-size:13px; font-weight:600;
  position:relative; cursor:pointer; background:var(--card-solid); transition:all .15s;
}
.cal-cell:hover{border-color:var(--brand); transform:scale(1.03); box-shadow:var(--shadow-xs);}
.cal-cell.empty{border:none; background:transparent;}
.cal-cell.today{background:var(--brand-bg); border-color:var(--brand); color:var(--brand-ink); font-weight:800;}
.cal-cell.sel{outline:2.5px solid var(--brand); box-shadow:0 0 0 4px var(--brand-bg);}
.cal-dot{width:8px; height:8px; border-radius:50%; background:#F43F5E; position:absolute; bottom:8px; left:8px; box-shadow:0 0 8px #F43F5E;}

/* ---------- Notifications ---------- */
.notif-row{display:flex; gap:16px; padding:16px 14px; border-bottom:1px solid var(--line); border-radius:12px; transition:background .15s;}
.notif-row:hover{background:var(--paper-2);}
.notif-row.unread{background:rgba(99,102,241,0.08); border-bottom-color:transparent;}

/* ---------- Toggle Switch ---------- */
.switch{width:42px; height:24px; border-radius:20px; background:var(--paper-2); border:1.5px solid var(--line); position:relative; flex-shrink:0; cursor:pointer; transition:all .2s;}
.switch.on{background:linear-gradient(135deg, #10B981, #059669); border-color:#059669;}
.switch .knob{width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:1.5px; left:2px; transition:left .2s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow:0 2px 4px rgba(0,0,0,.25);}
.switch.on .knob{left:20px;}
.setting-row{display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line);}
.setting-row:last-child{border-bottom:none;}
.setting-row .st{font-size:14.5px; font-weight:700;}
.setting-row .sd{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:28px; right:28px;
  background:linear-gradient(135deg, #0F172A, #1E293B); color:#fff;
  padding:14px 24px; border-radius:14px; font-size:14px; font-weight:700;
  box-shadow:0 16px 36px -8px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1);
  z-index:100; display:flex; align-items:center; gap:10px;
  animation:toastPop .3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes toastPop{ from{transform:translateY(20px) scale(0.9); opacity:0;} to{transform:translateY(0) scale(1); opacity:1;} }

/* ---------- Tabs ---------- */
.tab-row{display:flex; gap:8px; border-bottom:1.5px solid var(--line); margin-bottom:22px;}
.tab-item{
  padding:12px 18px; font-size:14px; font-weight:700; color:var(--ink-soft);
  border-bottom:3px solid transparent; cursor:pointer; position:relative; top:1.5px;
  transition:all .15s;
}
.tab-item:hover{color:var(--brand);}
.tab-item.active{color:var(--brand); border-bottom-color:var(--brand);}

/* ---------- Design Process Steps ---------- */
.dp-journey{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0;}
.dp-journey-step{display:flex; flex-direction:column; align-items:center; gap:10px; flex:1; text-align:center;}
.dp-journey-icon{
  width:48px; height:48px; border-radius:16px; background:linear-gradient(135deg, rgba(99,102,241,.12), rgba(236,72,153,.12));
  border:1.5px solid rgba(99,102,241,.3); color:var(--brand);
  display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.dp-journey-step:hover .dp-journey-icon{transform:scale(1.1); background:var(--grad-brand); color:#fff; box-shadow:0 8px 20px -4px rgba(99,102,241,.5);}
.dp-journey-icon svg{width:22px; height:22px;}
.dp-journey-label{font-size:13px; font-weight:700; color:var(--ink-soft);}
.dp-journey-arrow{color:var(--ink-faint); flex-shrink:0;}
.dp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
.dp-card-top{display:flex; align-items:center; justify-content:space-between;}
.dp-tag{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--brand); background:var(--brand-bg); padding:3px 8px; border-radius:6px;}
.dp-stat-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;}
.dp-stat-row:last-child{border-bottom:none;}

/* ---------- Empty State ---------- */
.empty-state{text-align:center; padding:56px 20px; color:var(--ink-soft);}
.empty-state svg{width:40px; height:40px; margin-bottom:14px; opacity:.4; color:var(--brand);}
.empty-state .t{font-family:var(--display); font-weight:700; font-size:17px; color:var(--ink); margin-bottom:5px;}
.empty-state .d{font-size:13.5px;}

/* ---------- Auth Modal / Wrap ---------- */
.auth-wrap{min-height:100vh; min-height:100dvh; width:100%; display:flex; align-items:center; justify-content:center; padding:32px;}
.auth-box{
  width:100%; max-width:440px; margin:0 auto; padding:36px; border-radius:var(--radius-xl);
  background:var(--card-solid); border:1px solid var(--line); box-shadow:var(--shadow-lg);
}
.auth-box .mark{
  width:46px; height:46px; border-radius:14px; background:var(--grad-brand); color:#fff;
  display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:900; font-size:24px;
  margin-bottom:24px; box-shadow:0 8px 24px -4px rgba(99,102,241,.6);
}
.role-select{display:flex; gap:10px; margin-bottom:22px;}
.role-opt{
  flex:1; padding:12px; border:1.5px solid var(--line); border-radius:12px; text-align:center;
  font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; transition:all .18s;
}
.role-opt:hover{border-color:var(--brand); color:var(--brand);}
.role-opt.sel{
  border-color:var(--brand); background:var(--brand-bg); color:var(--brand-ink);
  box-shadow:0 0 0 2px var(--brand-bg);
}

@media (max-width:960px){
  .sidebar{display:none;}
  .hero{grid-template-columns:1fr; padding:40px 24px; gap:40px;}
  .hero h1{font-size:40px;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .two-col{grid-template-columns:1fr;}
  .content{padding:20px;}
  .topbar{padding:14px 20px;}
  .topbar-search{display:none;}
  .how-grid{grid-template-columns:1fr;}
  .dp-grid{grid-template-columns:1fr;}
}
</style>

/* ============================= EXTRACTION LOGIC ============================= */
const DOC_KEYWORDS = ['income certificate','aadhaar','aadhar','passport-size photograph','passport size photograph','photograph','marksheet','mark sheet','id card','fee receipt','registration form','application form','bonafide certificate','caste certificate','medical certificate','transfer certificate','proposal','no objection certificate','noc'];
const CAT_KEYWORDS = {
  Scholarship:['scholarship'], Examination:['exam','examination'], Placement:['placement','recruit','company drive','interview'],
  Internship:['internship','intern'], Assignment:['assignment','project','proposal'], Events:['fest','event','cultural'],
  Workshop:['workshop','seminar','webinar'], Fees:['fee','fees','payment due'], Registration:['registration','register','enroll'],
  Academic:['syllabus','curriculum','academic','class'], General:[]
};
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];

function extractNotice(text){
  const lower = text.toLowerCase();
  let title = text.split(/[.\n]/)[0].trim();
  if(title.length > 70) title = title.slice(0,67)+'…';
  if(!title) title = 'Untitled Notice';

  let category = 'General';
  for(const c of CATS){
    const kws = CAT_KEYWORDS[c] || [];
    if(kws.some(k=>lower.includes(k))){ category = c; break; }
  }

  let deadline = null;
  const dateRe = new RegExp('(?:before|by|on|on or before)\\s+([a-z]+)\\s+(\\d{1,2})(?:st|nd|rd|th)?','i');
  const m = text.match(dateRe);
  if(m && MONTHS.includes(m[1].toLowerCase())){
    const mi = MONTHS.indexOf(m[1].toLowerCase())+1;
    deadline = `2026-${String(mi).padStart(2,'0')}-${String(parseInt(m[2])).padStart(2,'0')}`;
  } else {
    const bare = text.match(new RegExp('\\b('+MONTHS.join('|')+')\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b','i'));
    if(bare){
      const mi = MONTHS.indexOf(bare[1].toLowerCase())+1;
      deadline = `2026-${String(mi).padStart(2,'0')}-${String(parseInt(bare[2])).padStart(2,'0')}`;
    }
  }

  let target = null;
  const yearM = text.match(/(first|second|third|fourth|1st|2nd|3rd|4th|final)[\s-]?year/i);
  const deptM = text.match(/\b(CSE|ECE|EEE|ME|MECH|CIVIL|IT|MBA|MCA|AIML|AI\/ML)\b/i);
  if(yearM || deptM){ target = [yearM?yearM[0]:'', deptM?deptM[0].toUpperCase():''].filter(Boolean).join(' '); }
  else if(/all students/i.test(text)) target = 'All Students';

  let priority = 'Medium';
  if(['Scholarship','Examination','Fees'].includes(category) || /mandatory|compulsory|must|immediately/i.test(text)) priority = 'High';
  if(category==='Events' || category==='Workshop') priority = 'Medium';
  if(/optional|may attend/i.test(text)) priority = 'Low';

  let documents = DOC_KEYWORDS.filter(k=>lower.includes(k)).map(d=>d.replace(/\b\w/g,c=>c.toUpperCase()));
  documents = [...new Set(documents)];
  if(documents.length===0) documents = [];

  let actions = [];
  if(documents.length){
    actions.push('Download the required form');
    documents.forEach(d=> actions.push(`Obtain / attach ${d}`));
    actions.push('Submit before the deadline');
  } else {
    actions = ['Read the full notice carefully', 'Confirm whether this applies to you', 'Complete the required step before the deadline'];
  }

  return {title, category, deadline, target, priority, documents, actions, description:text.trim()};
}

function fmtDate(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
}
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date('2026-09-03T00:00:00');
  const d = new Date(iso+'T00:00:00');
  return Math.round((d-today)/86400000);
}
function priorityPillClass(p){ return p==='High'?'pill-high':p==='Medium'?'pill-medium':p==='Low'?'pill-low':'pill-neutral'; }

function progressForNotice(id){

  return Math.round(100*ts.filter(t=>t.status==='Completed').length/ts.length);

function isStrongPassword(pw){
  return pw.length >= 8 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
}
function togglePassVisibility(){
  const inp = document.getElementById('f-pass');
  const btn = document.getElementById('pw-toggle-btn');
  if(!inp) return;
  const show = inp.type==='password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = svgOf(show ? 'eyeOff' : 'eye');
}
function checkPassStrength(){
  const inp = document.getElementById('f-pass');
  const fb = document.getElementById('pw-feedback');
  if(!inp || !fb) return;
  const pw = inp.value;
  if(!pw){
    fb.textContent = 'Needs 8+ chars, upper, lower, number & symbol.';
    fb.style.color = 'var(--ink-faint)';
    return;
  }
  const missing = [];
  if(pw.length < 8) missing.push('8+ characters');
  if(!/[A-Z]/.test(pw)) missing.push('uppercase');
  if(!/[a-z]/.test(pw)) missing.push('lowercase');
  if(!/[0-9]/.test(pw)) missing.push('number');
  if(!/[^A-Za-z0-9]/.test(pw)) missing.push('symbol');
  if(missing.length){
    fb.textContent = 'Missing: ' + missing.join(', ');
    fb.style.color = 'var(--coral)';
  } else {
    fb.textContent = 'Strong password ✓';
    fb.style.color = 'var(--green)';
  }
}
function submitAuth(){
  const email = document.getElementById('f-email').value.trim() || 'you@college.edu';
  const isLogin = S.authMode==='login';
  const pass = document.getElementById('f-pass').value;
  if(!isLogin && !isStrongPassword(pass)){
    checkPassStrength();
    showToast('Password needs upper, lower, a number, and a special character');
    return;
  }
  const name = isLogin ? (email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase())) : (document.getElementById('f-name').value.trim() || 'Student User');
  const dept = document.getElementById('f-dept') ? document.getElementById('f-dept').value : 'CSE';
  const year = document.getElementById('f-year') ? document.getElementById('f-year').value : '2nd Year';
  S.session = {name, email, role:S.authRole, department: dept || 'CSE', year: year || '2nd Year'};
  if(S.notices.length===0) seedDemo();
  persist();
  showToast(`Welcome back, ${name.split(' ')[0]}! ✨`);
  go(S.authRole==='faculty' ? 'faculty' : S.authRole==='admin' ? 'admin' : 'dashboard');
}

function saveActionPlan(){
  const e = S.pendingExtract;
  const id = 'n'+Math.random().toString(36).slice(2,9);
  const notice = {
    id, title:e.title, category:e.category, target:e.target, deadline:e.deadline, priority:e.priority,
    description:e.description, documents:e.documents.length?e.documents:['Not specified in the notice.'],
    actions: e.actions.map(a=>[a,false]), source:'Added by you', createdAt:'2026-09-03'
  };
  S.notices.unshift(notice);
  e.actions.forEach(a=>{
    S.tasks.push({id:'t'+Math.random().toString(36).slice(2,9), noticeId:id, name:a, deadline:e.deadline, priority:e.priority, status:'Pending'});
  });
  if(e.deadline){
    S.notifications.unshift({id:'no'+Math.random().toString(36).slice(2,9), level:'info', msg:`Reminder created for ${notice.title}.`, time:'Just now', read:false, noticeId:id});
  }
  S.pendingExtract = null; S.noticeDraft='';
  persist();
  showToast('Action plan saved to dashboard! ✨');
  go('notice-detail', {activeNotice:id});
}

}

/* ============================= CALENDAR ============================= */
function pageCalendar(){
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const y = S.calYear, m = S.calMonth;
  const first = new Date(y,m,1);
  const startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const isoOf = d => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const notesByDay = {};
  S.notices.forEach(n=>{ if(n.deadline) (notesByDay[n.deadline]=notesByDay[n.deadline]||[]).push(n); });
  const selIso = isoOf(S.calSelected);
  const selNotices = notesByDay[selIso] || [];

  return `
  <div style="margin-bottom:26px;">
    <h1 style="font-size:32px;">Calendar Deadlines</h1>
    <div style="color:var(--ink-soft);font-size:14.5px;margin-top:4px;">${monthNames[m]} ${y} — View approaching submission dates.</div>
  </div>

  <div class="two-col" style="display:grid;grid-template-columns:1.35fr 1fr;gap:24px;">
    <div class="card">
      <div class="cal-grid">
        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(d=>{
          if(!d) return `<div class="cal-cell empty"></div>`;
          const iso = isoOf(d);
          const has = notesByDay[iso];
          const isToday = iso==='2026-09-03';
          const isSel = d===S.calSelected;
          return `<div class="cal-cell ${isToday?'today':''} ${isSel?'sel':''}" onclick="S.calSelected=${d};render()">
            <span>${d}</span>
            ${has?'<div class="cal-dot"></div>':''}
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="section-label">${monthNames[m]} ${S.calSelected}, ${y} Deadlines</div>
      ${selNotices.length? selNotices.map(n=>`
        <div style="padding:14px;border-radius:12px;background:var(--paper-2);margin-bottom:12px;cursor:pointer;" onclick="go('notice-detail',{activeNotice:'${n.id}'})">
          <div style="font-weight:700;font-size:14.5px;color:var(--ink);">${n.title}</div>
          <div style="display:flex;gap:8px;margin-top:6px;align-items:center;">
            <span class="pill ${priorityPillClass(n.priority)}">${n.priority} Priority</span>
            <span style="font-size:12px;color:var(--ink-soft);">${n.category}</span>
          </div>
        </div>`).join('') : `<div class="empty-state" style="padding:32px 10px;">${svgOf('cal')}<div class="d">No deadlines scheduled for this day.</div></div>`}
    </div>
  </div>`;
}

  const year = document.getElementById('fc-year').value.trim();
  const deadline = document.getElementById('fc-deadline').value || null;
  const docs = document.getElementById('fc-docs').value.split(',').map(s=>s.trim()).filter(Boolean);
  const id = 'n'+Math.random().toString(36).slice(2,9);

  S.notices.unshift({
    id, title, category:cat, priority:pri, target:[year,dept].filter(Boolean).join(' '), deadline,
    description: desc || title, documents: docs.length?docs:['Not specified in the notice.'],
    actions: docs.map(d=>[`Obtain / attach ${d}`,false]).concat([['Submit before the deadline',false]]),
    source: S.session.name, createdAt:'2026-09-03'
  });
  persist();
  showToast('Notice published successfully! ✨');
  go('faculty');
}

/* ============================= ROUTER & BOOT ============================= */
function render(){
  document.documentElement.setAttribute('data-theme', S.theme);
  let html = '';
  // Front page (landing) always renders directly
  if(S.route==='landing'){
    html = pageLanding();
    document.getElementById('app').innerHTML = html + (S.toast?toastHtml():'');
    return;
  }
  // Login route always renders auth in login mode
  if(S.route==='login'){
    S.authMode='login';
    html = pageAuth();
    document.getElementById('app').innerHTML = html + (S.toast?toastHtml():'');
    return;
  }
  // Register route always renders auth in register mode
  if(S.route==='register'){
    S.authMode='register';
    html = pageAuth();
    document.getElementById('app').innerHTML = html + (S.toast?toastHtml():'');
    return;
  }
  // If attempting to access internal dashboard without a session, route to front page
  if(!S.session){
    html = pageLanding();
    S.route = 'landing';
    document.getElementById('app').innerHTML = html + (S.toast?toastHtml():'');
    return;
  }
  let inner;
  switch(S.route){
    case 'dashboard': inner = (S.session.role==='faculty'?pageFaculty():S.session.role==='admin'?pageAdmin():pageDashboard()); break;
    case 'browse': inner = pageBrowse(); break;
    case 'add-notice': inner = pageAddNotice(); break;
    case 'analyzing': inner = pageAnalyzing(); break;
    case 'review': inner = pageReview(); break;
    case 'notice-detail': inner = pageNoticeDetail(); break;
    case 'tasks': inner = pageTasks(); break;
    case 'calendar': inner = pageCalendar(); break;
    case 'notifications': inner = pageNotifications(); break;
    case 'search': inner = pageSearch(); break;
    case 'profile': inner = pageProfile(); break;
    case 'settings': inner = pageSettings(); break;
    case 'faculty': inner = pageFaculty(); break;
    case 'faculty-create': inner = pageFacultyCreate(); break;
    case 'faculty-published': inner = pageFacultyPublished(); break;
    case 'design-process': inner = pageDesignProcess(); break;
    case 'admin': inner = pageAdmin(); break;
    case 'admin-users': inner = pageAdminUsers(); break;
    case 'admin-notices': inner = pageAdminNotices(); break;
    case 'admin-cats': inner = pageAdminCats(); break;
    default: inner = (S.session.role==='faculty'?pageFaculty():S.session.role==='admin'?pageAdmin():pageDashboard());
  }
  document.getElementById('app').innerHTML = shellWrap(inner) + (S.toast?toastHtml():'');
}

function toastHtml(){ return `<div class="toast">${svgOf('check')}<span>${S.toast}</span></div>`; }

(async function boot(){
  await loadPersisted();
  // Always land on the Front Page first as requested by the user
  S.route = 'landing';
  document.documentElement.setAttribute('data-theme', S.theme);
  if(S.session && S.notices.length===0) seedDemo();
  render();
})();
</script>
