<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice-to-Action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430;
  --ink-2:#262F3D;
  --paper:#FAF7EF;
  --paper-2:#F1ECE0;
  --card:#FFFFFF;
  --highlighter:#FFC93C;
  --highlighter-ink:#7A5B00;
  --green:#2F6B4F;
  --green-bg:#E7F1EB;
  --coral:#D64550;
  --coral-bg:#FBE7E8;
  --amber-bg:#FFF4DA;
  --line:#E4DDCB;
  --ink-soft:#6B7280;
  --ink-faint:#9AA1AC;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:18px;
  --shadow:0 1px 2px rgba(27,36,48,.06), 0 8px 24px -12px rgba(27,36,48,.18);
  --serif:'Source Serif 4', Georgia, serif;
  --sans:'Inter', -apple-system, sans-serif;
  --mono:'JetBrains Mono', monospace;
}
[data-theme="dark"]{
  --ink:#F3F1EA;
  --paper:#14181F;
  --paper-2:#1C222C;
  --card:#1E2530;
  --line:#2B3341;
  --ink-soft:#A2A9B5;
  --ink-faint:#6E7684;
  --amber-bg:#3A2E10;
  --green-bg:#173226;
  --coral-bg:#3A181A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box; margin:0; padding:0;}
html, body{height:100%;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit; color:inherit;}
::selection{background:var(--highlighter); color:var(--ink);}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; line-height:1.15; letter-spacing:-0.01em;}
.serif{font-family:var(--serif);}
.mono{font-family:var(--mono);}

/* ---------- Layout shell ---------- */
#app{min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex-shrink:0; background:var(--ink); color:#EDEAE0;
  display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh;
}
[data-theme="dark"] .sidebar{background:#0D1015;}
.sidebar .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px 8px;}
.sidebar .brand .mark{
  width:30px; height:30px; border-radius:8px; background:var(--highlighter);
  display:flex; align-items:center; justify-content:center; color:var(--ink); font-family:var(--serif); font-weight:700; font-size:16px;
}
.sidebar .brand .name{font-family:var(--serif); font-weight:600; font-size:16.5px; color:#fff;}
.navgroup{display:flex; flex-direction:column; gap:2px; margin-top:6px;}
.navitem{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:8px;
  font-size:14px; color:#C7C4B8; transition:background .12s;
}
.navitem svg{width:17px; height:17px; flex-shrink:0; opacity:.85;}
.navitem:hover{background:rgba(255,255,255,.06); color:#fff;}
.navitem.active{background:rgba(255,201,60,.14); color:var(--highlighter); font-weight:600;}
.navitem .badge{
  margin-left:auto; background:var(--coral); color:#fff; font-size:10.5px; font-weight:700;
  padding:1px 6px; border-radius:20px; font-family:var(--sans);
}
.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.08);}
.role-pill{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
  padding:2px 8px; border:1px solid rgba(255,255,255,.14); border-radius:20px; display:inline-block; margin-bottom:10px;
}
.user-chip{display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:8px;}
.user-chip:hover{background:rgba(255,255,255,.06);}
.avatar{
  width:30px; height:30px; border-radius:50%; background:var(--highlighter); color:var(--ink);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.user-chip .u-name{font-size:13.5px; font-weight:600; color:#fff;}
.user-chip .u-email{font-size:11.5px; color:var(--ink-faint);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:16px 32px;
  border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); z-index:5;
}
.topbar-search{
  display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
  border-radius:9px; padding:8px 12px; width:320px; color:var(--ink-soft); font-size:13.5px;
}
.topbar-search svg{width:15px; height:15px; opacity:.6;}
.topbar-search input{background:none; border:none; outline:none; width:100%; font-size:13.5px; color:var(--ink);}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  background:var(--card); border:1px solid var(--line); position:relative;
}
.icon-btn svg{width:17px; height:17px;}
.icon-btn:hover{border-color:var(--ink-soft);}
.dot{position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--coral); border:1.5px solid var(--paper);}
.content{padding:28px 32px 60px 32px; max-width:1180px; width:100%; margin:0 auto;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 18px; border-radius:9px; font-size:13.5px; font-weight:600; transition:all .12s; white-space:nowrap;
}
.btn svg{width:15px; height:15px;}
.btn-primary{background:var(--ink); color:var(--paper);}
[data-theme="dark"] .btn-primary{background:var(--highlighter); color:var(--ink);}
.btn-primary:hover{opacity:.88;}
.btn-highlight{background:var(--highlighter); color:var(--ink);}
.btn-highlight:hover{filter:brightness(0.96);}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
.btn-ghost:hover{border-color:var(--ink-soft);}
.btn-text{color:var(--ink-soft); font-weight:600; font-size:13.5px;}
.btn-text:hover{color:var(--ink);}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.btn-danger{background:var(--coral-bg); color:var(--coral);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-block{width:100%;}

/* ---------- Cards / misc ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-l); padding:20px;}
.card-flat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.pill-high{background:var(--coral-bg); color:var(--coral);}
.pill-medium{background:var(--amber-bg); color:var(--highlighter-ink);}
.pill-low{background:var(--green-bg); color:var(--green);}
.pill-neutral{background:var(--paper-2); color:var(--ink-soft);}
.progress{height:7px; border-radius:20px; background:var(--paper-2); overflow:hidden;}
.progress > div{height:100%; background:var(--green); border-radius:20px;}
.checkline{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
.checkline:last-child{border-bottom:none;}
.checkbox{
  width:19px; height:19px; border-radius:5px; border:1.6px solid var(--ink-faint); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; transition:all .12s;
}
.checkbox.done{background:var(--green); border-color:var(--green);}
.checkbox svg{width:12px; height:12px; color:#fff; opacity:0;}
.checkbox.done svg{opacity:1;}
.checkline.done .clabel{text-decoration:line-through; color:var(--ink-faint);}
.divider{height:1px; background:var(--line); margin:20px 0;}
.section-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:700; margin-bottom:10px;}
input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:9px; background:var(--card);
  font-size:13.5px; outline:none; transition:border-color .12s;
}
input:focus,textarea:focus,select:focus{border-color:var(--ink);}
label.field-label{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block;}
.field{margin-bottom:16px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.toast{
  position:fixed; bottom:24px; right:24px; background:var(--ink); color:var(--paper); padding:13px 20px;
  border-radius:10px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); z-index:100; display:flex; align-items:center; gap:9px;
}
[data-theme="dark"] .toast{background:var(--highlighter); color:var(--ink);}
.toast svg{width:16px; height:16px;}

/* ---------- Landing ---------- */
.landing-nav{
  display:flex; align-items:center; justify-content:space-between; padding:20px 48px; max-width:1280px; margin:0 auto;
}
.hero{padding:64px 48px 40px 48px; max-width:1280px; margin:0 auto; display:grid; grid-template-columns:1.05fr 1fr; gap:56px; align-items:center;}
.hero h1{font-size:52px; letter-spacing:-0.02em;}
.hero .lede{font-size:16.5px; color:var(--ink-soft); margin-top:18px; max-width:480px; line-height:1.6;}
.hero-cta{display:flex; gap:12px; margin-top:30px;}
.mark-swipe{
  background:linear-gradient(100deg, transparent 0%, transparent 40%, var(--highlighter) 40%, var(--highlighter) 100%);
  background-size:250% 100%; background-position:100% 0;
  animation:swipe 1.4s .4s ease forwards;
}
@keyframes swipe{ to{background-position:0 0;} }
.hero-visual{position:relative;}
.notice-paper{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:26px; box-shadow:var(--shadow);
  font-family:var(--serif); position:relative;
}
.notice-paper .stamp{position:absolute; top:16px; right:18px; font-size:10px; letter-spacing:.08em; color:var(--ink-faint); font-family:var(--sans); font-weight:700; border:1px solid var(--line); padding:3px 8px; border-radius:20px;}
.notice-paper h4{font-size:15px; margin-bottom:10px;}
.notice-paper p{font-size:12.5px; line-height:1.7; color:var(--ink-soft); font-family:var(--serif);}
.arrow-flow{display:flex; align-items:center; justify-content:center; gap:10px; margin:16px 0; color:var(--ink-faint); font-size:11.5px; font-weight:700; letter-spacing:.06em;}
.arrow-flow svg{width:16px; height:16px;}
.task-card-mini{background:var(--ink); color:var(--paper); border-radius:14px; padding:22px; box-shadow:var(--shadow);}
[data-theme="dark"] .task-card-mini{background:var(--highlighter); color:var(--ink);}
.task-card-mini .tag{font-size:10.5px; font-weight:700; letter-spacing:.05em; opacity:.7; margin-bottom:8px;}
.task-card-mini h4{font-size:16px; margin-bottom:12px; font-family:var(--serif); color:inherit;}
.mini-check{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 0; opacity:.92;}
.mini-check .b{width:14px; height:14px; border-radius:4px; border:1.5px solid currentColor; flex-shrink:0;}

.how-section{padding:56px 48px; max-width:1280px; margin:0 auto;}
.how-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:32px;}
.how-card{padding:26px; border:1px solid var(--line); border-radius:var(--radius-l); background:var(--card);}
.how-card .num{font-family:var(--mono); font-size:12px; color:var(--highlighter-ink); background:var(--amber-bg); display:inline-block; padding:3px 9px; border-radius:6px; margin-bottom:14px;}
.how-card h3{font-size:18px; margin-bottom:8px;}
.how-card p{font-size:13.5px; color:var(--ink-soft); line-height:1.6;}

.cats-strip{display:flex; flex-wrap:wrap; gap:10px; padding:0 48px 64px 48px; max-width:1280px; margin:0 auto;}
.cat-chip{padding:8px 16px; border-radius:20px; border:1px solid var(--line); font-size:12.5px; font-weight:600; background:var(--card);}

.landing-footer{border-top:1px solid var(--line); padding:26px 48px; display:flex; justify-content:space-between; align-items:center; max-width:1280px; margin:0 auto; font-size:12.5px; color:var(--ink-faint);}

/* ---------- Auth ---------- */
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:42px;}
.pw-toggle{
  position:absolute; right:4px; top:50%; transform:translateY(-50%); width:32px; height:32px;
  display:flex; align-items:center; justify-content:center; border-radius:7px; color:var(--ink-soft);
}
.pw-toggle:hover{background:var(--paper-2); color:var(--ink);}
.pw-toggle svg{width:16px; height:16px;}
.pw-feedback{font-size:11.5px; margin-top:7px; line-height:1.5; min-height:14px;}
.auth-wrap{min-height:100vh; min-height:100dvh; width:100%; display:flex; align-items:center; justify-content:center; padding:32px;}
.auth-box{width:100%; max-width:400px; margin:0 auto;}
.auth-box .mark{width:38px; height:38px; border-radius:10px; background:var(--highlighter); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; margin-bottom:20px;}
.role-select{display:flex; gap:8px; margin-bottom:20px;}
.role-opt{flex:1; padding:10px; border:1.5px solid var(--line); border-radius:9px; text-align:center; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.role-opt.sel{border-color:var(--ink); background:var(--paper-2); color:var(--ink);}

/* ---------- Dashboard ---------- */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:26px;}
.page-head h1{font-size:26px;}
.page-head .sub{color:var(--ink-soft); font-size:13.5px; margin-top:4px;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
.stat-card{padding:18px 20px;}
.stat-card .n{font-family:var(--serif); font-size:30px; font-weight:600;}
.stat-card .l{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start;}
.deadline-row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line);}
.deadline-row:last-child{border-bottom:none;}
.deadline-row .dl-title{font-weight:600; font-size:13.8px;}
.deadline-row .dl-meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.quick-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
.qa-btn{
  display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding:16px; border:1px solid var(--line);
  border-radius:var(--radius-m); background:var(--card);
}
.qa-btn:hover{border-color:var(--ink-soft);}
.qa-btn svg{width:18px; height:18px;}
.qa-btn span{font-size:12.8px; font-weight:600;}

/* ---------- Notice card list ---------- */
.notice-card{display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--line);}
.notice-card:last-child{border-bottom:none;}
.cat-icon{width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--paper-2);}
.cat-icon svg{width:18px; height:18px;}
.notice-card .body{flex:1; min-width:0;}
.notice-card .row1{display:flex; align-items:center; gap:8px; justify-content:space-between;}
.notice-card .ttl{font-weight:600; font-size:14.5px;}
.notice-card .meta{font-size:12px; color:var(--ink-soft); margin-top:3px; display:flex; gap:12px;}

/* ---------- Analyze flow ---------- */
.analyze-loading{max-width:460px; margin:60px auto; text-align:center;}
.analyze-step{display:flex; align-items:center; gap:10px; padding:10px 16px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; font-size:13.5px; text-align:left; opacity:0; animation:fadein .4s forwards;}
.analyze-step svg{width:16px; height:16px; color:var(--green); flex-shrink:0;}
@keyframes fadein{ to{opacity:1;} }
.extract-hint{font-size:11.5px; color:var(--ink-faint); font-style:italic;}
.not-specified{color:var(--ink-faint); font-style:italic;}
.warn-box{display:flex; gap:10px; padding:12px 14px; background:var(--amber-bg); border-radius:9px; font-size:12.8px; color:var(--highlighter-ink); align-items:flex-start;}
.warn-box svg{width:16px; height:16px; flex-shrink:0; margin-top:1px;}
.method-tabs{display:flex; gap:8px; margin-bottom:20px;}
.mtab{padding:9px 16px; border-radius:9px; border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink-soft);}
.mtab.active{background:var(--ink); color:var(--paper);}
[data-theme="dark"] .mtab.active{background:var(--highlighter); color:var(--ink);}
.doc-chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; font-size:12.8px; margin:4px 6px 0 0;}
.doc-chip svg{width:14px; height:14px;}
.upload-drop{border:1.5px dashed var(--line); border-radius:var(--radius-m); padding:36px; text-align:center; color:var(--ink-soft); cursor:pointer; transition:border-color .12s;}
.upload-drop:hover{border-color:var(--ink-soft);}
.file-preview{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:var(--radius-m); padding:12px 14px;}
.file-preview .thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--paper-2);}
.file-preview .doc-thumb{width:44px; height:44px; border-radius:8px; background:var(--amber-bg); color:var(--highlighter-ink); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.file-preview .doc-thumb svg{width:20px; height:20px;}
.file-preview .fname{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.file-preview .fsize{font-size:11.5px; color:var(--ink-faint);}

/* ---------- Calendar ---------- */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:14px;}
.cal-dow{font-size:11px; text-align:center; color:var(--ink-faint); font-weight:700; padding-bottom:4px;}
.cal-cell{
  min-height:64px; border:1px solid var(--line); border-radius:8px; padding:6px; font-size:12px; position:relative; cursor:pointer;
}
.cal-cell:hover{border-color:var(--ink-soft);}
.cal-cell.empty{border:none;}
.cal-cell.today{background:var(--amber-bg); border-color:var(--highlighter);}
.cal-cell.sel{outline:1.5px solid var(--ink);}
.cal-dot{width:6px; height:6px; border-radius:50%; background:var(--coral); position:absolute; bottom:6px; left:6px;}

/* ---------- Tabs ---------- */
.tab-row{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px;}
.tab-item{padding:10px 4px; margin-right:22px; font-size:13.5px; font-weight:600; color:var(--ink-soft); border-bottom:2px solid transparent; position:relative; top:1px;}
.tab-item.active{color:var(--ink); border-bottom-color:var(--ink);}
[data-theme="dark"] .tab-item.active{border-bottom-color:var(--highlighter);}

/* ---------- Notif ---------- */
.notif-row{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
.notif-row.unread{background:var(--amber-bg); margin:0 -14px; padding:14px; border-radius:8px; border-bottom:none;}
.notif-dot-lead{width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0;}

/* ---------- Settings ---------- */
.switch{width:38px; height:22px; border-radius:20px; background:var(--paper-2); border:1px solid var(--line); position:relative; flex-shrink:0;}
.switch.on{background:var(--green);}
.switch .knob{width:16px; height:16px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch.on .knob{left:18px;}
.setting-row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line);}
.setting-row:last-child{border-bottom:none;}
.setting-row .st{font-size:13.8px; font-weight:600;}
.setting-row .sd{font-size:12px; color:var(--ink-soft); margin-top:2px;}

/* ---------- Empty ---------- */
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state svg{width:34px; height:34px; margin-bottom:12px; opacity:.4;}
.empty-state .t{font-weight:600; color:var(--ink); margin-bottom:4px;}
.empty-state .d{font-size:13px;}

@media (max-width:900px){
  .sidebar{display:none;}
  .hero{grid-template-columns:1fr; padding:36px 20px;}
  .hero h1{font-size:36px;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .two-col{grid-template-columns:1fr;}
  .content{padding:20px;}
  .topbar{padding:14px 18px;}
  .topbar-search{display:none;}
  .how-grid{grid-template-columns:1fr;}
}
</style>

/* ============================= EXTRACTION ("AI") ============================= */
const DOC_KEYWORDS = ['income certificate','aadhaar','aadhar','passport-size photograph','passport size photograph','photograph','marksheet','mark sheet','id card','fee receipt','registration form','application form','bonafide certificate','caste certificate','medical certificate','transfer certificate','proposal','no objection certificate','noc'];
const CAT_KEYWORDS = {
  Scholarship:['scholarship'], Examination:['exam','examination'], Placement:['placement','recruit','company drive','interview'],
  Internship:['internship','intern'], Assignment:['assignment','project','proposal'], Events:['fest','event','cultural'],
  Workshop:['workshop','seminar','webinar'], Fees:['fee','fees','payment due'], Registration:['registration','register','enroll'],
  Academic:['syllabus','curriculum','academic','class'], General:[]
};
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];

function extractNotice(text){
  const lower = text.toLowerCase();
  // Title: first sentence-ish, capped
  let title = text.split(/[.\n]/)[0].trim();
  if(title.length > 70) title = title.slice(0,67)+'…';
  if(!title) title = 'Untitled Notice';

  // Category
  let category = 'General';
  for(const c of CATS){
    const kws = CAT_KEYWORDS[c] || [];
    if(kws.some(k=>lower.includes(k))){ category = c; break; }
  }

  // Deadline — look for "before/by/on <Month> <day>"
  let deadline = null;
  const dateRe = new RegExp('(?:before|by|on|on or before)\\s+([a-z]+)\\s+(\\d{1,2})(?:st|nd|rd|th)?','i');
  const m = text.match(dateRe);
  if(m && MONTHS.includes(m[1].toLowerCase())){
    const mi = MONTHS.indexOf(m[1].toLowerCase())+1;
    deadline = `2026-${String(mi).padStart(2,'0')}-${String(parseInt(m[2])).padStart(2,'0')}`;
  } else {
    const bare = text.match(new RegExp('\\b('+MONTHS.join('|')+')\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b','i'));
    if(bare){
      const mi = MONTHS.indexOf(bare[1].toLowerCase())+1;
      deadline = `2026-${String(mi).padStart(2,'0')}-${String(parseInt(bare[2])).padStart(2,'0')}`;
    }
  }

  // Target audience
  let target = null;
  const yearM = text.match(/(first|second|third|fourth|1st|2nd|3rd|4th|final)[\s-]?year/i);
  const deptM = text.match(/\b(CSE|ECE|EEE|ME|MECH|CIVIL|IT|MBA|MCA|AIML|AI\/ML)\b/i);
  if(yearM || deptM){ target = [yearM?yearM[0]:'', deptM?deptM[0].toUpperCase():''].filter(Boolean).join(' '); }
  else if(/all students/i.test(text)) target = 'All Students';

  // Priority
  let priority = 'Medium';
  if(['Scholarship','Examination','Fees'].includes(category) || /mandatory|compulsory|must|immediately/i.test(text)) priority = 'High';
  if(category==='Events' || category==='Workshop') priority = 'Medium';
  if(/optional|may attend/i.test(text)) priority = 'Low';

  // Documents
  let documents = DOC_KEYWORDS.filter(k=>lower.includes(k)).map(d=>d.replace(/\b\w/g,c=>c.toUpperCase()));
  documents = [...new Set(documents)];
  if(documents.length===0) documents = [];

  // Actions
  let actions = [];
  if(documents.length){
    actions.push('Download the required form');
    documents.forEach(d=> actions.push(`Obtain / attach ${d}`));
    actions.push('Submit before the deadline');
  } else {
    actions = ['Read the full notice carefully', 'Confirm whether this applies to you', 'Complete the required step before the deadline'];
  }

  return {title, category, deadline, target, priority, documents, actions, description:text.trim()};
}

function fmtDate(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');

}
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date('2026-09-03T00:00:00');
  const d = new Date(iso+'T00:00:00');
  return Math.round((d-today)/86400000);
}

function isStrongPassword(pw){
  return pw.length >= 8 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
}
function togglePassVisibility(){
  const inp = document.getElementById('f-pass');
  const btn = document.getElementById('pw-toggle-btn');
  if(!inp) return;
  const show = inp.type==='password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = svgOf(show ? 'eyeOff' : 'eye');
}
function checkPassStrength(){
  const inp = document.getElementById('f-pass');
  const fb = document.getElementById('pw-feedback');
  if(!inp || !fb) return;
  const pw = inp.value;
  if(!pw){
    fb.textContent = 'Needs 8+ characters, uppercase, lowercase, a number, and a special character.';
    fb.style.color = 'var(--ink-faint)';
    return;
  }
  const missing = [];
  if(pw.length < 8) missing.push('8+ characters');
  if(!/[A-Z]/.test(pw)) missing.push('an uppercase letter');
  if(!/[a-z]/.test(pw)) missing.push('a lowercase letter');
  if(!/[0-9]/.test(pw)) missing.push('a number');
  if(!/[^A-Za-z0-9]/.test(pw)) missing.push('a special character (e.g. @ # $ !)');
  if(missing.length){
    fb.textContent = 'Missing: ' + missing.join(', ');
    fb.style.color = 'var(--coral)';
  } else {
    fb.textContent = 'Strong password ✓';
    fb.style.color = 'var(--green)';
  }
}
function submitAuth(){
  const email = document.getElementById('f-email').value.trim() || 'you@college.edu';
  const isLogin = S.authMode==='login';
  const pass = document.getElementById('f-pass').value;
  if(!isLogin && !isStrongPassword(pass)){
    checkPassStrength();
    showToast('Password needs upper, lower, a number, and a special character');
    return;
  }
  const name = isLogin ? (email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase())) : (document.getElementById('f-name').value.trim() || 'Student User');
  const dept = document.getElementById('f-dept') ? document.getElementById('f-dept').value : 'CSE';
  const year = document.getElementById('f-year') ? document.getElementById('f-year').value : '2nd Year';
  S.session = {name, email, role:S.authRole, department: dept || 'CSE', year: year || '2nd Year'};
  if(S.notices.length===0) seedDemo();
  persist();
  showToast(`Welcome, ${name.split(' ')[0]}!`);
  go(S.authRole==='faculty' ? 'faculty' : S.authRole==='admin' ? 'admin' : 'dashboard');
}

function pageCalendar(){
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const y = S.calYear, m = S.calMonth;
  const first = new Date(y,m,1);
  const startDow = (first.getDay()+6)%7; // Mon=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const isoOf = d => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const notesByDay = {};
  S.notices.forEach(n=>{ if(n.deadline) (notesByDay[n.deadline]=notesByDay[n.deadline]||[]).push(n); });
  const selIso = isoOf(S.calSelected);
  const selNotices = notesByDay[selIso] || [];

  return `
  <div class="page-head"><div><h1>Calendar</h1><div class="sub">${monthNames[m]} ${y}</div></div></div>
  <div class="two-col">
    <div class="card">
      <div class="cal-grid">
        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(d=>{
          if(!d) return `<div class="cal-cell empty"></div>`;
          const iso = isoOf(d);
          const has = notesByDay[iso];
          const isToday = iso==='2026-09-03';
          const isSel = d===S.calSelected;
          return `<div class="cal-cell ${isToday?'today':''} ${isSel?'sel':''}" onclick="S.calSelected=${d};render()">${d}${has?'<div class="cal-dot"></div>':''}</div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="section-label">${monthNames[m]} ${S.calSelected}</div>
      ${selNotices.length? selNotices.map(n=>`
        <div style="margin-bottom:12px;cursor:pointer" onclick="go('notice-detail',{activeNotice:'${n.id}'})">
          <div style="font-weight:600;font-size:13.8px;">${n.title}</div>
          <span class="pill ${priorityPillClass(n.priority)}">${n.priority==='High'?'🔴':n.priority==='Medium'?'🟡':'🟢'} ${n.priority} Priority</span>
        </div>`).join('') : `<div class="empty-state" style="padding:24px 10px;">${svgOf('cal')}<div class="d">Nothing due on this day.</div></div>`}
    </div>
  </div>`;
}

function facultyAttachmentHtml(){
  const a = S.facultyAttachment;
  if(!a){
    return `<div class="upload-drop" onclick="document.getElementById('fc-file').click()">
      ${svgOf('upload')}
      <div style="margin-top:10px;font-weight:600;color:var(--ink);">Drop a PDF, JPG or PNG here</div>
      <div style="font-size:12.5px;margin-top:4px;">or click to browse · up to 4 MB</div>
    </div>`;
  }
  const isImage = a.type && a.type.startsWith('image/');
  return `<div class="file-preview">
    ${isImage ? `<img class="thumb" src="${a.dataUrl}">` : `<div class="doc-thumb">${svgOf('doc')}</div>`}
    <div style="flex:1;min-width:0;">
      <div class="fname">${a.name}</div>
      <div class="fsize">${a.sizeLabel}</div>
    </div>
    <button type="button" class="icon-btn" onclick="removeFacultyAttachment(event)" title="Remove">${svgOf('trash')}</button>
  </div>`;
}
function handleFacultyFile(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const okTypes = ['application/pdf','image/jpeg','image/jpg','image/png'];
  if(!okTypes.includes(file.type)){
    showToast('Only PDF, JPG, or PNG files are supported');
    evt.target.value = '';
    return;
  }
  if(file.size > 4 * 1024 * 1024){
    showToast('File is too large — please keep it under 4 MB');
    evt.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    S.facultyAttachment = {
      name: file.name,
      type: file.type,
      sizeLabel: (file.size/1024).toFixed(0) + ' KB',
      dataUrl: reader.result
    };
    render();
  };
  reader.onerror = () => showToast('Could not read that file — try again');
  reader.readAsDataURL(file);
}
function removeFacultyAttachment(evt){
  if(evt) evt.stopPropagation();
  S.facultyAttachment = null;
  const inp = document.getElementById('fc-file');
  if(inp) inp.value = '';
  render();
}
function publishNotice(){
  const title = document.getElementById('fc-title').value.trim() || 'Untitled Notice';
  const desc = document.getElementById('fc-desc').value.trim();

  const pri = document.getElementById('fc-pri').value;
  const dept = document.getElementById('fc-dept').value.trim();

  const deadline = document.getElementById('fc-deadline').value || null;
  const docs = document.getElementById('fc-docs').value.split(',').map(s=>s.trim()).filter(Boolean);
  const id = 'n'+Math.random().toString(36).slice(2,9);
  S.notices.unshift({id, title, category:cat, priority:pri, target:[year,dept].filter(Boolean).join(' '), deadline,
    description: desc || title, documents: docs.length?docs:['Not specified in the notice.'],
    actions: docs.map(d=>[`Obtain / attach ${d}`,false]).concat([['Submit before the deadline',false]]),
    source: S.session.name, createdAt:'2026-09-03', attachment: S.facultyAttachment});
  S.facultyAttachment = null;
  persist();
  showToast('Notice published');
  go('faculty');
}

/* ============================= ROUTER / RENDER ============================= */
function render(){
  document.documentElement.setAttribute('data-theme', S.theme);
  let html = '';
  if(!S.session){
    if(S.route==='login'){ S.authMode='login'; html = pageAuth(); }
    else if(S.route==='register'){ S.authMode='register'; html = pageAuth(); }
    else { html = pageLanding(); S.route='landing'; }
    document.getElementById('app').innerHTML = html + (S.toast?toastHtml():'');
    return;
  }
  let inner;
  switch(S.route){
    case 'dashboard': inner = pageDashboard(); break;
    case 'browse': inner = pageBrowse(); break;
    case 'add-notice': inner = pageAddNotice(); break;
    case 'analyzing': inner = pageAnalyzing(); break;
    case 'review': inner = pageReview(); break;
    case 'notice-detail': inner = pageNoticeDetail(); break;
    case 'tasks': inner = pageTasks(); break;
    case 'calendar': inner = pageCalendar(); break;
    case 'notifications': inner = pageNotifications(); break;
    case 'search': inner = pageSearch(); break;
    case 'profile': inner = pageProfile(); break;
    case 'settings': inner = pageSettings(); break;
    case 'faculty': inner = pageFaculty(); break;
    case 'faculty-create': inner = pageFacultyCreate(); break;
    case 'faculty-published': inner = pageFacultyPublished(); break;
    case 'admin': inner = pageAdmin(); break;
    case 'admin-users': inner = pageAdminUsers(); break;
    case 'admin-notices': inner = pageAdminNotices(); break;
    case 'admin-cats': inner = pageAdminCats(); break;
    default: inner = pageDashboard();
  }
  document.getElementById('app').innerHTML = shellWrap(inner) + (S.toast?toastHtml():'');
}
function toastHtml(){ return `<div class="toast">${svgOf('check')}<span>${S.toast}</span></div>`; }

/* ============================= BOOT ============================= */
(async function boot(){
  await loadPersisted();
  document.documentElement.setAttribute('data-theme', S.theme);
  if(S.session && S.notices.length===0) seedDemo();
  render();
})();
</script>
</body>
